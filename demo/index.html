<title>TrendPilot 데모 · REPLAY</title>
<style>
:root{
  --cream:#FFF9E6; --ink:#3A3226; --muted:#8C8171; --line:#EFE2C4;
  --orange:#FF9F1C; --peach:#FFB5A7; --sky:#BEE1E6; --mint:#C1FBA4; --lilac:#E2CFEA;
  --card:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);
  font:15px/1.65 -apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  padding-bottom:104px;}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 24px}
a{color:#D97706}
h1{font-size:22px;margin:0}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:14px;background:linear-gradient(140deg,var(--orange),var(--peach));
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;
  letter-spacing:.02em;box-shadow:0 3px 0 #F3D9A4}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 16px}
.replay{display:inline-flex;align-items:center;gap:7px;background:var(--lilac);color:#5B3F6B;
  border:2px dashed #C9A9DC;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.02em}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 20px;
  margin-bottom:14px;box-shadow:0 4px 0 #F3E6C8}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}
.card.pop{animation:pop .32s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.rail span{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:#FFF;
  border:2px solid var(--line);color:var(--muted)}
.rail span.done{background:var(--mint);border-color:#A6E886;color:#2F5D1C}
.rail span.now{background:var(--orange);border-color:#E8890A;color:#fff;box-shadow:0 2px 0 #E0A85C}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#FFFDF6;
  font:inherit;color:var(--ink)}
.chk{display:flex;gap:9px;align-items:flex-start;margin-top:11px;font-size:13px;color:#5C5142;
  background:#FFFDF6;border:2px solid var(--line);border-radius:12px;padding:9px 12px}
.box{width:17px;height:17px;border-radius:6px;border:2px solid #D9C9A4;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:#fff}
.box.on{background:var(--orange);border-color:var(--orange)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;
  background:var(--sky);color:#245E68;margin-right:5px}
.pill.mock{background:#FFE8B0;color:#8A5A00;border:1.5px solid #F0C971}
.pill.safe{background:var(--mint);color:#2F5D1C}
.pill.growth{background:var(--peach);color:#8A3A2C}
.pill.weak{background:var(--lilac);color:#5B3F6B}
.pill.live{background:#D6F5DC;color:#1D6B33}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  background:#FFF4DC;border-radius:7px;padding:2px 7px;overflow-wrap:anywhere}
.nw{white-space:nowrap}
.muted{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.03em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:4px 0 12px}
.kpi{background:#FFFDF6;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:21px;line-height:1.25}
.kpi span{font-size:11px;color:var(--muted);font-weight:700}
.kpi.k1{background:#F0FAF0;border-color:#CBEEC0}
.kpi.k2{background:#FFF1EE;border-color:#FFD2C8}
.kpi.k3{background:#EFF8FA;border-color:#CCE8ED}
.kpi.k4{background:#F7F0FA;border-color:#DEC9E8}
.act{border:2px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;background:#FFFDF6}
.act h3{font-size:15px;margin:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tabs button{background:#fff;border:2px solid var(--line);color:var(--muted);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--sky);border-color:#9CCDD4;color:#1E5A64}
.tabpane{border:2px solid var(--line);border-top:none;border-radius:0 0 14px 14px;background:#fff;
  padding:12px 14px;font-size:13px;margin-top:-2px;border-top:2px solid var(--line);border-radius:14px}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.dl button{background:#fff;border:2px solid var(--orange);color:#C4700A;border-radius:12px;
  padding:8px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.dl button:hover{background:#FFF1D6}
.notice{background:#FFF0D2;border:2px solid #F3D99C;color:#8A5A00;border-radius:14px;padding:11px 14px;
  font-size:13px;margin-bottom:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,249,230,.96);border-top:2px solid var(--line);
  backdrop-filter:blur(6px);padding:12px 16px;z-index:9}
.barin{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#next{background:var(--orange);color:#fff;border:0;border-radius:14px;padding:12px 26px;font:inherit;
  font-weight:800;cursor:pointer;box-shadow:0 4px 0 #D9820D}
#next:active{transform:translateY(2px);box-shadow:0 2px 0 #D9820D}
#next[disabled]{background:#E8DCC2;box-shadow:0 4px 0 #D8CBAF;cursor:default;color:#fff}
#reset{background:#fff;color:#8C8171;border:2px solid var(--line);border-radius:14px;padding:10px 18px;
  font:inherit;font-weight:700;cursor:pointer}
.prog{flex:1;min-width:120px;height:10px;background:#F1E4C6;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--peach));
  border-radius:999px;transition:width .3s ease}
ul{margin:5px 0;padding-left:19px}
li{margin:2px 0}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mini{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 13px}
.mini b{font-size:13px}
.done-hero{text-align:center;padding:26px 16px}
.done-hero .big{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--mint);
  border:3px solid #A6E886;color:#2F5D1C;font-size:32px;font-weight:900;display:flex;
  align-items:center;justify-content:center}
kbd{background:#fff;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;
  padding:1px 6px;font-size:11px;font-family:inherit;color:var(--muted)}
</style>

  if (name === "publishing-package.md")

      const p = (a.production_package||{}).publishing_package || {};

function download(name){
  const type = name.endsWith(".json") ? "application/json" : "text/markdown";
  const blob = new Blob([artifactBody(name)], {type: type + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

    <ul class="muted">${(RES.limitations||[]).map(l => `<li>${esc(l)}</li>`).join("")}</ul>`);
}

function stepPublish(){
  return card("DNSimple publish <span class='pill mock'>replay</span>",
   `<p style="margin:0 0 10px">실행 기록을 DNS TXT 레코드로 남기는 스폰서 경로입니다.</p>
    <div class="split">
      <div class="mini"><b>상태</b><br><span class="mono">sandbox_record_created</span></div>
      <div class="mini"><b>public_url</b><br><span class="mono">null</span> — ${UNK}</div>
      <div class="mini"><b>실제 환경</b><br><span class="muted">DNSIMPLE_API_TOKEN / ACCOUNT_ID / ZONE 미설정 → 라이브에서는 <span class="mono">not_configured</span></span></div>
    </div>
    <p class="muted" style="margin:10px 0 0">이 화면의 <span class="mono">sandbox_record_created</span>는 샌드박스 스텁 재생값입니다. 공개 URL은 발급되지 않았으므로 <b>미확인</b>으로 표시하며, 어떤 공개 주소도 주장하지 않습니다.</p>
    <table style="margin-top:10px"><thead><tr><th>provider</th><th>operation</th><th>mode</th><th>status</th><th>detail</th></tr></thead><tbody>
    ${traceRow("dnsimple","publish","replay","sandbox_record_created","public_url=null · 실제 DNS 레코드 생성 아님")}
    </tbody></table>`);
}

function stepDone(){
  return card("완료",
   `<div class="done-hero">
      <div class="big">✓</div>
      <h3 style="margin:8px 0 4px;font-size:19px">재생 완료 — ${esc(RUN_ID)} · status ${esc(RUN.status)} / stage ${esc(RUN.stage)}</h3>
      <p class="muted" style="margin:0 0 14px">합성 예제 + 실제 실행 영수증. 실시간 실행이 아닙니다.</p>
      <p><a href="https://github.com/sanghyun747/aiaiiai" target="_blank" rel="noopener"><b>github.com/sanghyun747/aiaiiai</b></a></p>
    </div>
    <div class="split">
      <div class="mini"><b>실제 영수증</b><br><span class="muted">Daytona 샌드박스 ${RECEIPT.daytona_sandbox} · followers.json SHA-256 확보 · Nosana ${RECEIPT.nosana_model} plan 라이브 파싱 성공</span></div>
      <div class="mini"><b>재생 구간</b><br><span class="muted">recommend · render · publish 는 fixtures/run-sample.json 재생값입니다.</span></div>
      <div class="mini"><b>미확인</b><br><span class="muted">라이브 7종 산출물 SHA-256, DNSimple 공개 URL, YouTube 실시간 근거</span></div>
    </div>
    <p class="muted" style="margin:12px 0 0">“처음부터” 버튼으로 다시 재생할 수 있습니다.</p>`);
}

/* ---------- 상태 기계 ---------- */
const STEPS = [
  {stage:0, html:stepForm},
  {stage:1, html:stepCreate},
  {stage:2, html:stepValidate},
  {stage:3, html:stepAnalyze},
  {stage:4, html:stepPlan},
  {stage:5, html:stepRecommend},
  {stage:6, html:stepRender},
  {stage:7, html:() => secEvidence() + secFollowers() + secActions()},
  {stage:8, html:stepPublish},
  {stage:9, html:stepDone}
];
let idx = -1;

function drawRail(cur){
  $("rail").innerHTML = STAGES.map((s, i) =>
    `<span class="${i < cur ? "done" : (i === cur ? "now" : "")}">${i+1}. ${esc(s)}</span>`).join("");
}
function advance(){
  if (idx >= STEPS.length - 1) return;
  idx++;
  const st = STEPS[idx];
  const div = document.createElement("div");
  div.innerHTML = st.html();
  $("feed").appendChild(div);
  drawRail(st.stage);
  $("progi").style.width = Math.round((idx+1) / STEPS.length * 100) + "%";
  const last = idx >= STEPS.length - 1;
  $("next").disabled = last;
  $("next").textContent = last ? "재생 완료 ✓" : "다음 ▶";
  $("hint").innerHTML = last ? '“처음부터”로 다시 재생' : `<kbd>Space</kbd> / <kbd>→</kbd> 로도 진행 · ${idx+1}/${STEPS.length}`;
  div.scrollIntoView({behavior:"smooth", block:"start"});
}
function reset(){
  idx = -1; $("feed").innerHTML = ""; $("progi").style.width = "0%";
  $("next").disabled = false; $("next").textContent = "다음 ▶";
  window.scrollTo({top:0, behavior:"smooth"});
  advance();
}
$("next").addEventListener("click", advance);
$("reset").addEventListener("click", reset);
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter"){
    if (e.target.tagName === "BUTTON" && e.key === "Enter") return;
    e.preventDefault(); advance();
  }
});
$("feed").addEventListener("click", e => {
  const dl = e.target.closest("button[data-dl]");
  if (dl){ download(dl.dataset.dl); return; }
  const tb = e.target.closest(".tabs button");
  if (tb){
    const i = tb.dataset.a;
    tb.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("on"));
    tb.classList.add("on");
    $("pane-" + i).innerHTML = tabHTML((RES.actions[i]||{}).production_package || {}, tb.dataset.k);
  }
});
advance();
</script>
</body>
